services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-odoo:19.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8072:8072"
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: odoo
      PGPASSWORD: odoo
    volumes:
      - odoo-web-data:/var/lib/odoo
      # Mount extra/custom addons from the host, uncomment if needed:
      # - ./custom-addons:/mnt/extra-addons

volumes:
  odoo-db-data:
  odoo-web-data:
