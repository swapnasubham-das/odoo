[options]
; Odoo configuration used inside the Docker image.
; Database connection settings are provided via the standard
; PostgreSQL environment variables (PGHOST, PGPORT, PGUSER, PGPASSWORD)
; which take precedence over the values below - see docker-compose.yml.
admin_passwd = admin
; /odoo/odoo/addons holds the core modules (base, web, ...), /odoo/addons
; holds every community addon shipped in this repository (account, sale,
; crm, hr, website, ...), and /mnt/extra-addons is an optional mount point
; for custom addons (see docker-compose.yml).
addons_path = /odoo/odoo/addons,/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
proxy_mode = True
